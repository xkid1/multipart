name: Feature request
description: Suggest an improvement or a new capability.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The core parser has zero runtime dependencies, and integrations (frameworks,
        cloud SDKs) stay optional. Proposals that keep it that way are the easiest to accept.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core parser
        - Express middleware
        - NestJS middleware
        - Storage (local, S3, Azure)
        - New framework or storage integration
        - TypeScript types
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you'd like. A short usage example helps a lot.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other libraries that solve this.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
