name: Question or other request
description: Ask how to use the library, or raise something not covered by the other forms.
title: '[Question]: '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/xkid1/multipart#readme) covers setup for Express,
        NestJS, plain Node.js, and local, S3 and Azure storage, including limits and error codes.

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Usage / how do I...?
        - Express
        - NestJS
        - Storage (local, S3, Azure)
        - TypeScript
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Question or request
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Relevant code, versions, or links. Please remove secrets.
      render: typescript
