name: Setup Node and Yarn
description:
  Set up the repository's pinned Node and Yarn toolchain and install dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Ensure Corepack is installed and enabled
      shell: bash
      run: |
        if ! command -v corepack >/dev/null 2>&1; then
          npm install --global corepack
        fi
        corepack enable
        corepack install
    - name: Install all dependencies (including optional)
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: yarn install --immutable
    - name: Install optional peer dependencies for CI build
      shell: bash
      run: |
        # Install only the specified optional dependencies to avoid build failures
        # End users will install these on their side as needed
        yarn add --optional express @azure/storage-blob @aws-sdk/client-s3 @nestjs/common 2>/dev/null || echo "Optional dependencies installation completed (may have warnings)"
