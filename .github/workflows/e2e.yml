name: End-user tests

# Packs the package as `npm publish` would and tests the tarball in fresh consumer
# projects on every supported Node.js version: Node http, Express 4/5, NestJS,
# TypeScript resolution modes, and S3/Azure against local emulators. See e2e/README.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # publish.yml runs this suite on the release tag, then publishes the tested tarball.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to pack and test
        required: true
        type: string
    outputs:
      tarball:
        description: File name of the tested tarball in the "package-tarball" artifact
        value: ${{ jobs.pack.outputs.tarball }}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: Pack tarball
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup
      - name: npm pack (runs prepack → yarn build)
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP/pack" --loglevel=error | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  matrix:
    name: Node ${{ matrix.node }} (${{ matrix.pm }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]
        pm: [npm]
        include:
          - node: 24
            pm: pnpm
    steps:
      # Only the e2e/ folder is needed; the package itself comes from the tarball.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: e2e
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        if: matrix.pm == 'pnpm'
        run: corepack enable pnpm
      - name: Start S3 and Azure emulators
        run: bash e2e/emulators.sh up
      - name: Run end-user suite
        env:
          E2E_REQUIRE_CLOUD: '1'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: node e2e/run.mjs --pm ${{ matrix.pm }} --tarball "$RUNNER_TEMP/pack/${{ needs.pack.outputs.tarball }}"
      - name: Stop emulators
        if: always()
        run: bash e2e/emulators.sh down

  # One stable status check to mark as required, whatever the matrix contains.
  e2e:
    name: E2E
    needs: [pack, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All end-user test jobs passed
        env:
          PACK_RESULT: ${{ needs.pack.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: |
          echo "pack: $PACK_RESULT, matrix: $MATRIX_RESULT"
          [ "$PACK_RESULT" = success ] && [ "$MATRIX_RESULT" = success ]
